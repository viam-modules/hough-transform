name: go-tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/hybridgroup/opencv:4.11.0
    # The opencv images pin GOTOOLCHAIN=local, so a go.mod bump past the Go bundled
    # in the image fails outright instead of fetching the toolchain it asks for.
    env:
      GOTOOLCHAIN: auto

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Test
      run: make test

    - name: Compile Module
      run: make module.tar.gz
